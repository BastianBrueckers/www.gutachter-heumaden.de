<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gutachter Heumaden</title>
  <meta name="description" content="Startseite von Gutachter Heumaden.">
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2933;
      background: #f6f8fb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(720px, 100%);
      padding: 48px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 20px 45px rgba(31, 41, 51, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.1;
      color: #0f172a;
    }

    p {
      margin: 0 auto;
      max-width: 560px;
      font-size: 1.125rem;
      line-height: 1.6;
      color: #52606d;
    }
  </style>
</head>
<body>
  <main>
    <h1>Gutachter Heumaden</h1>
    <p>Willkommen auf der neuen Startseite. Weitere Informationen folgen in Kürze.</p>

</html>
